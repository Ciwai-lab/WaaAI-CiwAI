<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Form Pendaftaran Siswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    form {
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

  <h2>Formulir Pendaftaran Siswa</h2>
  <form id="pendaftaranForm">
    <label>Nama Lengkap</label>
    <input type="text" name="Nama" required>

    <label>Jenis Kelamin</label>
    <select name="JK" required>
      <option value="">-- Pilih --</option>
      <option value="L">Laki-laki</option>
      <option value="P">Perempuan</option>
    </select>

    <label>NISN</label>
    <input type="text" name="NISN">

    <label>Tempat Lahir</label>
    <input type="text" name="Tempat Lahir">

    <label>Tanggal Lahir</label>
    <input type="date" name="Tanggal Lahir">

    <label>NIK</label>
    <input type="text" name="NIK">

    <label>Alamat</label>
    <input type="text" name="Alamat">

    <label>HP</label>
    <input type="text" name="HP">

    <label>Nama Ayah</label>
    <input type="text" name="Nama Ayah">

    <label>Nama Ibu</label>
    <input type="text" name="Nama Ibu">

    <label>Rombel Saat Ini</label>
    <input type="text" name="Rombel Saat Ini">

    <button type="submit">Kirim Data</button>
  </form>

  <!-- Tombol preview -->
  <button id="lihatData">📋 Lihat Data (Preview)</button>
  <div id="preview"></div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzzLGRo7VrwvjZkIXYRq8hFtkkooaitbcWMnbselSiYbMT9oIb9TU2CMVJYCv47STTA/exec"; // ganti pake URL Apps Script lo

    // Submit form
    document.getElementById("pendaftaranForm").addEventListener("submit", e => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());

      fetch(scriptURL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      })
        .then(res => res.text())
        .then(() => {
          alert("✅ Data berhasil dikirim!");
          form.reset();
        })
        .catch(err => alert("❌ Gagal: " + err.message));
    });

    // Tombol preview
    document.getElementById("lihatData").addEventListener("click", () => {
      fetch(scriptURL + "?action=read")
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) {
            document.getElementById("preview").innerHTML = "<p>Belum ada data.</p>";
            return;
          }

          let html = "<table><tr>";
          Object.keys(data[0]).forEach(k => html += `<th>${k}</th>`);
          html += "</tr>";

          // ambil 5 data terakhir
          data.slice(-5).forEach(row => {
            html += "<tr>";
            Object.values(row).forEach(val => html += `<td>${val}</td>`);
            html += "</tr>";
          });
          html += "</table>";
          document.getElementById("preview").innerHTML = html;
        })
        .catch(err => {
          document.getElementById("preview").innerHTML = "<p>❌ Gagal ambil data: " + err.message + "</p>";
        });
    });
  </script>
</body>

</html>

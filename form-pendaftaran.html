<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📑 Sistem Pendaftaran — PKBM HALIFA</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      background: #f3f4f6;
    }

    .container {
      max-width: 980px;
      margin: auto;
      padding: 16px;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 20px;
      color: #1f2937;
    }

    /* === Tabs === */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .tab.active {
      background: #fff;
      font-weight: 600;
      color: #2563eb;
      border-top: 3px solid #2563eb;
    }

    .tab-content {
      display: none;
      background: #fff;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .tab-content.active {
      display: block;
    }

    /* === Form elements === */
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 12px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .btn-ghost {
      background: #6b7280;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .preview-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #f9fafb;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .tab {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>📑 Sistem Pendaftaran Siswa — PKBM HALIFA</h2>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="tab1">📝 Form Pendaftaran</div>
      <div class="tab" data-tab="tab2">✏️ Edit Data</div>
      <div class="tab" data-tab="tab3">📋 Lihat Data</div>
      <div class="tab" data-tab="tab4">📷 Upload Foto</div>
      <div class="tab" data-tab="tab5">⬇️ Download Data</div>
    </div>

    <!-- === TAB 1: Form Pendaftaran === -->
    <div id="tab1" class="tab-content active">
      <form id="form">
        <input type="hidden" name="No. Pendaftaran" />

        <div class="grid">
          <div><label>Nama</label><input type="text" name="Nama" required /></div>
          <div><label>Jenis Kelamin</label>
            <select name="JK" required>
              <option value="">-- Pilih --</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>

          <div><label>NISN</label><input type="text" name="NISN" /></div>
          <div><label>Tempat Lahir</label><input type="text" name="Tempat Lahir" /></div>

          <div><label>Tanggal Lahir</label><input type="date" name="Tanggal Lahir" /></div>
          <div><label>NIK</label><input type="text" name="NIK" /></div>

          <div style="grid-column:1/3"><label>Alamat</label><input type="text" name="Alamat" /></div>

          <div><label>RT</label><input type="text" name="RT" /></div>
          <div><label>RW</label><input type="text" name="RW" /></div>

          <div><label>Dusun</label><input type="text" name="Dusun" /></div>
          <div><label>Kelurahan</label><input type="text" name="Kelurahan" /></div>

          <div><label>Kecamatan</label><input type="text" name="Kecamatan" /></div>
          <div><label>Kode Pos</label><input type="text" name="Kode Pos" /></div>

          <div><label>HP</label><input type="text" name="HP" /></div>
        </div>

        <h3>👨‍👩‍👦 Data Orang Tua</h3>
        <div class="grid">
          <div><label>Nama Ayah</label><input type="text" name="Nama Ayah" /></div>
          <div><label>Tahun Lahir Ayah</label><input type="number" name="Tahun Lahir Ayah" /></div>

          <div><label>Jenjang Pendidikan Ayah</label><input type="text" name="Jenjang Pendidikan Ayah" /></div>
          <div><label>Pekerjaan Ayah</label><input type="text" name="Pekerjaan Ayah" /></div>

          <div><label>NIK Ayah</label><input type="text" name="NIK Ayah" /></div>
          <div><label>Nama Ibu</label><input type="text" name="Nama Ibu" /></div>

          <div><label>Tahun Lahir Ibu</label><input type="number" name="Tahun Lahir Ibu" /></div>
          <div><label>Jenjang Pendidikan Ibu</label><input type="text" name="Jenjang Pendidikan Ibu" /></div>

          <div><label>Pekerjaan Ibu</label><input type="text" name="Pekerjaan Ibu" /></div>
          <div><label>NIK Ibu</label><input type="text" name="NIK Ibu" /></div>

          <div style="grid-column:1/3"><label>Rombel Saat Ini</label><input type="text" name="Rombel Saat Ini" /></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="submit">🚀 Kirim Data</button>
          <button type="button" id="btnReset" class="btn-ghost">Reset</button>
        </div>
      </form>
      <div id="msg" class="small" style="margin-top:8px"></div>
    </div>

    <!-- === TAB 2: Edit Data === -->
    <div id="tab2" class="tab-content">
      <h3>🔍 Cari & Edit Data Siswa</h3>
      <input type="text" id="searchInput" placeholder="Cari Nama atau NISN">
      <button id="btnSearch">Cari</button>
      <div id="searchResult"></div>
    </div>

    <!-- === TAB 3: Lihat Data === -->
    <div id="tab3" class="tab-content">
      <h3>📋 Data Terakhir</h3>
      <div id="preview"></div>
      <button id="btnPreview">Refresh Preview</button>
    </div>

    <!-- === TAB 4: Upload Foto === -->
    <div id="tab4" class="tab-content">
      <h3>📷 Upload Foto Siswa</h3>
      <input type="file" id="fotoInput" accept="image/*">
      <button id="btnUpload">Upload</button>
      <div id="uploadMsg"></div>
    </div>

    <!-- === TAB 5: Download Data === -->
    <div id="tab5" class="tab-content">
      <h3>⬇️ Download Data</h3>
      <p>Download seluruh data pendaftaran dalam format CSV:</p>
      <a href="https://script.google.com/macros/s/AKfycbx7vVTY1ehFtEbBpFsC64d-20CCC35NV8Azs0HBEt6z3gTW4_o8m9ICnDidK1TH3CwG/exec?action=download"
        target="_blank">📥 Download Data (Excel)</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7vVTY1ehFtEbBpFsC64d-20CCC35NV8Azs0HBEt6z3gTW4_o8m9ICnDidK1TH3CwG/exec";

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const preview = document.getElementById('preview');

    function showMsg(t, clr = '') {
      msg.textContent = t;
      msg.style.color = clr;
      setTimeout(() => { msg.textContent = ''; }, 5000);
    }

    // === Submit Form ===
    form.addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(form);
      fetch(SCRIPT_URL, { method: "POST", body: fd })
        .then(res => res.json())
        .then(d => {
          alert("✅ Data berhasil dikirim! ID: " + d.id);
          form.reset();
          loadPreview();
        })
        .catch(err => alert("❌ Gagal kirim: " + err));
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      form.reset();
      form.querySelector('input[name="No. Pendaftaran"]').value = '';
    });

    // === Preview ===
    function loadPreview() {
      fetch(SCRIPT_URL + "?action=read&limit=1")
        .then(res => res.json())
        .then(data => {
          const prevDiv = document.getElementById("preview");
          if (data.length === 0) {
            prevDiv.innerHTML = "<p>Belum ada data</p>";
            return;
          }
          const d = data[0];
          prevDiv.innerHTML = `
            <div class="preview-card">
              <p><b>No. Pendaftaran:</b> ${d["No. Pendaftaran"]}</p>
              <p><b>Nama:</b> ${d["Nama"]}</p>
              <p><b>NISN:</b> ${d["NISN"]}</p>
              <p><b>Tanggal Lahir:</b> ${d["Tanggal Lahir"]}</p>
              <button onclick="editData('${d["No. Pendaftaran"]}')">✏️ Edit</button>
            </div>`;
        });
    }

    document.getElementById('btnPreview').addEventListener('click', () => loadPreview());

    // === Edit Data ===
    function editData(noPend) {
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(rows => {
          const d = rows.find(r => r["No. Pendaftaran"] === noPend);
          if (!d) { alert("❌ Data tidak ditemukan"); return; }
          for (const k in d) {
            const input = form.querySelector(`[name="${k}"]`);
            if (input) input.value = d[k];
          }
          // auto switch tab ke form
          switchTab("tab1");
        });
    }

    // === Search ===
    document.getElementById('btnSearch').addEventListener('click', () => {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(rows => {
          const result = rows.filter(r =>
            String(r["Nama"]).toLowerCase().includes(keyword) ||
            String(r["NISN"]).toLowerCase().includes(keyword)
          );
          const out = document.getElementById("searchResult");
          out.innerHTML = result.map(d => `
            <div class="preview-card">
              <p><b>No. Pendaftaran:</b> ${d["No. Pendaftaran"]}</p>
              <p><b>Nama:</b> ${d["Nama"]}</p>
              <p><b>NISN:</b> ${d["NISN"]}</p>
              <button onclick="editData('${d["No. Pendaftaran"]}')">✏️ Edit</button>
            </div>`).join("");
        });
    });

    // === Tabs Switching ===
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".tab-content");
    function switchTab(id) {
      tabs.forEach(t => t.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));
      document.querySelector(`.tab[data-tab="${id}"]`).classList.add("active");
      document.getElementById(id).classList.add("active");
    }
    tabs.forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

    // auto-load preview
    loadPreview();
  </script>
</body>

</html>

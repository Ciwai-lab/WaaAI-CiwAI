<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Form Input Peserta Didik</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Form Input Peserta Didik</h2>
    <form id="studentForm">

      <div class="row">
        <div>
          <label>No</label>
          <input type="number" name="No">
        </div>
        <div>
          <label>Nama</label>
          <input type="text" name="Nama" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Jenis Kelamin</label>
          <select name="JK" required>
            <option value="">--Pilih--</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>
        <div>
          <label>NISN</label>
          <input type="text" name="NISN">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Tempat Lahir</label>
          <input type="text" name="Tempat Lahir">
        </div>
        <div>
          <label>Tanggal Lahir</label>
          <input type="date" name="Tanggal Lahir">
        </div>
      </div>

      <label>NIK</label>
      <input type="text" name="NIK">

      <label>Alamat</label>
      <input type="text" name="Alamat">

      <div class="row">
        <div>
          <label>RT</label>
          <input type="text" name="RT">
        </div>
        <div>
          <label>RW</label>
          <input type="text" name="RW">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Dusun</label>
          <input type="text" name="Dusun">
        </div>
        <div>
          <label>Kelurahan</label>
          <input type="text" name="Kelurahan">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Kecamatan</label>
          <input type="text" name="Kecamatan">
        </div>
        <div>
          <label>Kode Pos</label>
          <input type="text" name="Kode Pos">
        </div>
      </div>

      <label>HP</label>
      <input type="text" name="HP">

      <h3>Data Ayah</h3>
      <label>Nama Ayah</label>
      <input type="text" name="Nama Ayah">

      <div class="row">
        <div>
          <label>Tahun Lahir Ayah</label>
          <input type="number" name="Tahun Lahir Ayah">
        </div>
        <div>
          <label>Jenjang Pendidikan Ayah</label>
          <input type="text" name="Jenjang Pendidikan Ayah">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Pekerjaan Ayah</label>
          <input type="text" name="Pekerjaan Ayah">
        </div>
        <div>
          <label>NIK Ayah</label>
          <input type="text" name="NIK Ayah">
        </div>
      </div>

      <h3>Data Ibu</h3>
      <label>Nama Ibu</label>
      <input type="text" name="Nama Ibu">

      <div class="row">
        <div>
          <label>Tahun Lahir Ibu</label>
          <input type="number" name="Tahun Lahir Ibu">
        </div>
        <div>
          <label>Jenjang Pendidikan Ibu</label>
          <input type="text" name="Jenjang Pendidikan Ibu">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Pekerjaan Ibu</label>
          <input type="text" name="Pekerjaan Ibu">
        </div>
        <div>
          <label>NIK Ibu</label>
          <input type="text" name="NIK Ibu">
        </div>
      </div>

      <label>Rombel Saat Ini</label>
      <input type="text" name="Rombel Saat Ini">

      <button type="submit">Kirim</button>
    </form>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzzLGRo7VrwvjZkIXYRq8hFtkkooaitbcWMnbselSiYbMT9oIb9TU2CMVJYCv47STTA/exec"; // ganti dengan URL Web App ente

    document.getElementById("studentForm").addEventListener("submit", e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {};
      formData.forEach((value, key) => data[key] = value);

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      })
        .then(res => res.json())
        .then(response => {
          alert("✅ Data berhasil dikirim!");
          e.target.reset();
        })
        .catch(err => alert("❌ Gagal kirim: " + err));
    });
  </script>
</body>

</html>

<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📑 Sistem Pendaftaran — PKBM HALIFA</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="style.css" rel="stylesheet"> <!-- ini harus terakhir -->

  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      background: #f3f4f6;
    }

    .container {
      max-width: 980px;
      margin: auto;
      padding: 16px;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 20px;
      color: #1f2937;
    }

    .section-title {
      margin-top: 2.5rem;
      /* jarak dari atas */
      margin-bottom: 1.5rem;
      /* jarak ke bawah */
      font-size: 1.5rem;
      /* agak besar */
      font-weight: 700;
      /* bold */
      color: #1e293b;
      /* abu gelap elegan */
      position: relative;
      /* biar bisa pasang garis */
      padding-bottom: 0.5rem;
      /* kasih ruang buat garis */
    }

    .section-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 60px;
      /* panjang garis */
      height: 3px;
      /* tebal garis */
      background: linear-gradient(to right, #2563eb, #38bdf8);
      border-radius: 2px;
    }

    /* === Tabs === */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .tab.active {
      background: #fff;
      font-weight: 600;
      color: #2563eb;
      border-top: 3px solid #2563eb;
    }

    .tab-content {
      display: none;
      background: #fff;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .tab-content.active {
      display: block;
    }

    /* === Form elements === */
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 12px;
      /* Jarak atas tombol */
      padding: 10px 16px;
      /* Padding lebih proporsional */
      border: none;
      /* Hapus border default */
      border-radius: 8px;
      /* Sudut membulat */
      background-color: #2563eb;
      /* Warna utama */
      color: #fff;
      /* Warna teks putih */
      font-size: 14px;
      /* Ukuran teks */
      font-weight: 500;
      /* Sedikit bold untuk keterbacaan */
      cursor: pointer;
      /* Pointer saat hover */
      transition: all 0.2s ease-in-out;
      /* Animasi smooth untuk hover */
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      /* Shadow ringan */
    }

    button:hover {
      background-color: #1d4ed8;
      /* Warna hover */
      transform: translateY(-1px);
      /* Sedikit naik saat hover */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }


    .btn-ghost {
      background: #6b7280;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .preview-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #f9fafb;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 767px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .grid>[style*="grid-column"] {
        grid-column: auto ! important;
      }

      input,
      select,
      textarea {
        font-size: 15px;
        padding: 10px;
      }

      button {
        width: 100%;
        /* tombol full width biar gampang diklik */
        margin-top: 8px;
      }

      .tab {
        font-size: 13px;
        padding: 10px;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    .preview-card {
      border: 1px solid #e5e7eb;
      /* gray-200 */
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .preview-card p {
      margin: 4px 0;
      font-size: 14px;
    }

    .preview-card button {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container text-center my-8">
    <h2 class="text-3xl font-bold tracking-wide relative inline-block pb-2">
      📑 Sistem Pendaftaran — PKBM HALIFA
      <span class="absolute left-1/2 -bottom-1 w-16 h-1 bg-blue-500 rounded -translate-x-1/2"></span>
    </h2>
  </div>

  <!-- Tabs -->
  <div class="tabs flex flex-wrap justify-center gap-2 mt-4 border-b pb-2">
    <div class="tab active" data-tab="tab1">📝 Form</div>
    <div class="tab" data-tab="tab2">✏️ Edit</div>
    <div class="tab" data-tab="tab3">📋 Views</div>
    <div class="tab" data-tab="tab4">📷 Upload</div>
    <div class="tab" data-tab="tab5">⬇️ Download</div>
  </div>

  <!-- === TAB 1: Form Pendaftaran === -->
  <div id="tab1" class="tab-content active">
    <form id="form">
      <input type="hidden" name="No. Pendaftaran" />

      <h3 class="section-title">👨‍🎓👩‍🎓 Data Siswa</h3>
      <div class="grid">
        <div><label>Nama</label><input type="text" name="Nama" required /></div>
        <div><label>Jenis Kelamin</label>
          <select name="JK" required>
            <option value="">-- Pilih --</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>

        <div><label>NISN</label><input type="text" name="NISN" /></div>
        <div><label>Tempat Lahir</label><input type="text" name="Tempat Lahir" /></div>

        <div><label>Tanggal Lahir</label><input type="date" name="Tanggal Lahir" /></div>
        <div><label>NIK</label><input type="text" name="NIK" /></div>

        <div style="grid-column:1/3"><label>Alamat</label><input type="text" name="Alamat" /></div>

        <div><label>RT</label><input type="text" name="RT" /></div>
        <div><label>RW</label><input type="text" name="RW" /></div>

        <div><label>Dusun</label><input type="text" name="Dusun" /></div>
        <div><label>Kelurahan</label><input type="text" name="Kelurahan" /></div>

        <div><label>Kecamatan</label><input type="text" name="Kecamatan" /></div>
        <div><label>Kode Pos</label><input type="text" name="Kode Pos" /></div>

        <div><label>HP</label><input type="text" name="HP" /></div>
      </div>

      <h3 class="section-title">👨‍👩‍👦 Data Orang Tua</h3>
      <div class="grid">
        <div><label>Nama Ayah</label><input type="text" name="Nama Ayah" /></div>
        <div><label>Tahun Lahir Ayah</label><input type="number" name="Tahun Lahir Ayah" /></div>

        <div><label>Jenjang Pendidikan Ayah</label><input type="text" name="Jenjang Pendidikan Ayah" /></div>
        <div><label>Pekerjaan Ayah</label><input type="text" name="Pekerjaan Ayah" /></div>

        <div><label>NIK Ayah</label><input type="text" name="NIK Ayah" /></div>
        <div><label>Nama Ibu</label><input type="text" name="Nama Ibu" /></div>

        <div><label>Tahun Lahir Ibu</label><input type="number" name="Tahun Lahir Ibu" /></div>
        <div><label>Jenjang Pendidikan Ibu</label><input type="text" name="Jenjang Pendidikan Ibu" /></div>

        <div><label>Pekerjaan Ibu</label><input type="text" name="Pekerjaan Ibu" /></div>
        <div><label>NIK Ibu</label><input type="text" name="NIK Ibu" /></div>

        <div style="grid-column:1/3"><label>Rombel Saat Ini</label><input type="text" name="Rombel Saat Ini" /></div>
      </div>

      <div class="flex flex-wrap gap-3 my-6 mt-8">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
          🚀 Kirim Data
        </button>
        <button type="button" id="btnReset"
          class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg shadow hover:bg-gray-300 transition">
          Reset
        </button>
      </div>

    </form>
    <div id="msg" class="small" style="margin-top:8px"></div>
  </div>

  <!-- === TAB 2: Data Siswa === -->
  <div id="tab2" class="tab-content">
    <h3 class="section-title">📋 Data Siswa</h3>

    <!-- Search Box -->
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="searchInput" placeholder="🔍 Cari Nama atau No.Reg" class="w-full sm:w-96 px-4 py-2 border border-gray-300 rounded-lg shadow-sm 
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
             transition duration-200" />

      <button id="btnSearch" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg shadow-md 
             hover:bg-blue-700 hover:scale-105 transition transform w-full sm:w-auto">
        Cari
      </button>
    </div>

    <!-- Search Result -->
    <div id="searchResult" class="mt-4 space-y-3"></div>
  </div>

  <!-- === TAB 3: Lihat Data === -->
  <div id="tab3" class="tab-content">
    <h3 class="section-title">📋 Data Terakhir</h3>
    <div id="preview"></div>
    <button id="btnPreview" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg shadow-md 
         hover:bg-blue-700 hover:scale-105 transition transform w-full sm:w-auto mt-2">Refresh Preview</button>
  </div>

  <!-- === TAB 4: Upload Foto === -->
  <div id="tab4" class="tab-content">
    <h3 class="section-title">📷 Upload Foto Siswa</h3>
    <input type="file" id="fotoInput" accept="image/*" class="w-full sm:w-96 px-4 py-2 border border-gray-300 rounded-lg shadow-sm 
         focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
         transition duration-200" />
    <button id="btnUpload" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg shadow-md 
         hover:bg-blue-700 hover:scale-105 transition transform w-full sm:w-auto mt-2">Upload</button>
    <div id="uploadMsg"></div>
  </div>

  <!-- === TAB 5: Download Data === -->
  <div id="tab5" class="tab-content">
    <h3 class="section-title">⬇️ Download Data</h3>
    <p>Download seluruh data pendaftaran dalam format (Excel):</p>
    <a href="https://script.google.com/macros/s/AKfycbx7vVTY1ehFtEbBpFsC64d-20CCC35NV8Azs0HBEt6z3gTW4_o8m9ICnDidK1TH3CwG/exec?action=download"
      target="_blank">📥 Download Data (Excel)</a>
  </div>
  </div>

  <!-- Footer -->
  <div id="ciwai-footer"></div>
  <script src="/assets/js/footer.js"></script>


  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7vVTY1ehFtEbBpFsC64d-20CCC35NV8Azs0HBEt6z3gTW4_o8m9ICnDidK1TH3CwG/exec";

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const preview = document.getElementById('preview');

    function showMsg(t, clr = '') {
      msg.textContent = t;
      msg.style.color = clr;
      setTimeout(() => { msg.textContent = ''; }, 5000);
    }

    // === Submit Form ===
    form.addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(form);
      fetch(SCRIPT_URL, { method: "POST", body: fd })
        .then(res => res.json())
        .then(d => {
          alert("✅ Data berhasil dikirim! ID: " + d.id);
          form.reset();
          loadPreview();
        })
        .catch(err => alert("❌ Gagal kirim: " + err));
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      form.reset();
      form.querySelector('input[name="No. Pendaftaran"]').value = '';
    });

    // === Preview ===

    // === Edit Data ===
    function editData(noPend) {
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(rows => {
          const d = rows.find(r => r["No. Pendaftaran"] === noPend);
          if (!d) { alert("❌ Data tidak ditemukan"); return; }
          for (const k in d) {
            const input = form.querySelector(`[name="${k}"]`);
            if (input) input.value = d[k];
          }
          // auto switch tab ke form
          switchTab("tab1");
        });
    }

    // === Search ===
    document.getElementById('btnSearch').addEventListener('click', () => {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(rows => {
          const result = rows.filter(r =>
            String(r["Nama"]).toLowerCase().includes(keyword) ||
            String(r["NISN"]).toLowerCase().includes(keyword)
          );
          const out = document.getElementById("searchResult");
          out.innerHTML = result.map(d => `
        <div class="preview-card">
          <p><b>No. Pendaftaran:</b> ${d["No. Pendaftaran"]}</p>
          <p><b>Nama:</b> ${d["Nama"]}</p>
          <p><b>NISN:</b> ${d["NISN"]}</p>
          <div class="mt-2 flex gap-2">
            <button onclick="viewDetail('${d["No. Pendaftaran"]}')">👁️ View</button>
            <button onclick="editData('${d["No. Pendaftaran"]}')">✏️ Edit</button>
          </div>
          <div id="detail-${d["No. Pendaftaran"]}" class="hidden mt-2 p-2 border rounded bg-gray-50"></div>
        </div>`).join("");
        });
    });

    // Fungsi View Detail
    function viewDetail(noPend) {
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(rows => {
          const d = rows.find(r => r["No. Pendaftaran"] === noPend);
          if (!d) { alert("❌ Data tidak ditemukan"); return; }

          const container = document.getElementById(`detail-${noPend}`);
          const fields = [
            ["JK", "Jenis Kelamin"],
            ["Tempat Lahir", "Tempat Lahir"],
            ["Tanggal Lahir", "Tanggal Lahir"],
            ["NIK", "NIK"],
            ["Alamat", "Alamat"],
            ["RT", "RT"],
            ["RW", "RW"],
            ["Dusun", "Dusun"],
            ["Kelurahan", "Kelurahan"],
            ["Kecamatan", "Kecamatan"],
            ["Kode Pos", "Kode Pos"],
            ["HP", "HP"],
            ["Nama Ayah", "👨 Nama Ayah"],
            ["Tahun Lahir Ayah", "Tahun Lahir Ayah"],
            ["Jenjang Pendidikan Ayah", "Jenjang Pendidikan Ayah"],
            ["Pekerjaan Ayah", "Pekerjaan Ayah"],
            ["NIK Ayah", "NIK Ayah"],
            ["Nama Ibu", "👩 Nama Ibu"],
            ["Tahun Lahir Ibu", "Tahun Lahir Ibu"],
            ["Jenjang Pendidikan Ibu", "Jenjang Pendidikan Ibu"],
            ["Pekerjaan Ibu", "Pekerjaan Ibu"],
            ["NIK Ibu", "NIK Ibu"],
            ["Rombel Saat Ini", "📚 Rombel Saat Ini"],
            // tambahin sesuai kebutuhan
          ];

          let filled = [];
          let empty = [];

          fields.forEach(([key, label]) => {
            if (d[key] && d[key].trim() !== "") {
              filled.push(`<p><b>${label}:</b> ${d[key]}</p>`);
            } else {
              empty.push(label); // simpan label kosong
            }
          });

          container.innerHTML = `
  ${filled.join("")}
  ${empty.length > 0
              ? `
        <div class="mt-3 p-3 border border-yellow-300 rounded bg-yellow-50">
          <p class="font-semibold text-yellow-700">⚠️ Data berikut belum diisi:</p>
          <ul class="list-disc list-inside text-yellow-700">
            ${empty.map(f => `<li>${f}</li>`).join("")}
          </ul>
        </div>
      `
              : ""
            }
`;

          container.classList.toggle("hidden");
        });
    }

    // === Tabs Switching ===
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".tab-content");
    function switchTab(id) {
      tabs.forEach(t => t.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));
      document.querySelector(`.tab[data-tab="${id}"]`).classList.add("active");
      document.getElementById(id).classList.add("active");
    }
    tabs.forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

    // auto-load preview
    loadPreview();
  </script>

  <!-- Back to Top Button -->
  <button onclick="scrollToTop()" id="backToTopBtn" class="hidden fixed bottom-6 right-6 z-50 
  w-12 h-12 flex items-center justify-center
  bg-white/40 hover:bg-white/60 backdrop-blur-sm
  text-blue-800 hover:text-blue-900 
  rounded-full shadow-md transition duration-300 border border-white/50">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd"
        d="M10 4a1 1 0 01.894.553l5 10a1 1 0 01-1.788.894L10 6.618 5.894 15.447a1 1 0 01-1.788-.894l5-10A1 1 0 0110 4z"
        clip-rule="evenodd" />
    </svg>
  </button>

  <!-- AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Script Section -->
  <script>
    // ✅ Init AOS (Animate On Scroll)
    AOS.init({
      duration: 800,
      once: true,
    });

    // ✅ Scroll-to-top button logic
    const backToTopBtn = document.getElementById("backToTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        backToTopBtn.classList.remove("hidden");
      } else {
        backToTopBtn.classList.add("hidden");
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>

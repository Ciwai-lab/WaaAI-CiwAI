<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CiwAI Smart Digital — Updates</title>
  <meta name="description"
        content="Stay updated with the latest news, product improvements, and release notes from CiwAI Smart Digital." />

  <link rel="icon" type="image/webp" href="assets/images/favicon.webp" />

  <!-- OG tags -->
  <meta property="og:title" content="CiwAI Smart Digital — Updates" />
  <meta property="og:description"
        content="Discover the latest updates, improvements, and announcements from the CiwAI team." />
  <meta property="og:url" content="https://ciwaidevtools.netlify.app/updates" />
  <meta property="og:type" content="website" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Extra libs -->
  <script src="/assets/js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Simple shimmer styles -->
  <style>
    .shimmer {
      position: relative;
      overflow: hidden;
      background: #e5e7eb;
    }
    .shimmer:after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, rgba(229,231,235,0) 0%, rgba(255,255,255,.7) 50%, rgba(229,231,235,0) 100%);
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800" data-page="updates" data-hero-title="Updates"
      data-hero-subtitle="Latest news, product improvements, and release notes." data-hero-variant="subtle">

  <script src="/assets/js/lang.js"></script>

  <!-- HEADER -->
  <div id="ciwai-header"></div>

  <!-- HERO -->
  <div id="ciwai-hero"></div>

  <main class="max-w-4xl mx-auto py-8 px-4" id="updates-container">
    <!-- Initial skeleton -->
    <h1 class="text-3xl font-bold mb-6">🚀 Updates & Announcements</h1>
    <div id="updates-skeleton" class="grid gap-6">
      <!-- 3 skeleton cards -->
      <div class="bg-white p-4 rounded-2xl shadow">
        <div class="shimmer h-40 w-full rounded-xl mb-4"></div>
        <div class="shimmer h-6 w-2/3 rounded mb-2"></div>
        <div class="shimmer h-4 w-1/3 rounded mb-4"></div>
        <div class="shimmer h-4 w-full rounded mb-2"></div>
        <div class="shimmer h-4 w-5/6 rounded"></div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow">
        <div class="shimmer h-40 w-full rounded-xl mb-4"></div>
        <div class="shimmer h-6 w-1/2 rounded mb-2"></div>
        <div class="shimmer h-4 w-1/3 rounded mb-4"></div>
        <div class="shimmer h-4 w-full rounded mb-2"></div>
        <div class="shimmer h-4 w-2/3 rounded"></div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow">
        <div class="shimmer h-40 w-full rounded-xl mb-4"></div>
        <div class="shimmer h-6 w-3/4 rounded mb-2"></div>
        <div class="shimmer h-4 w-1/4 rounded mb-4"></div>
        <div class="shimmer h-4 w-full rounded mb-2"></div>
        <div class="shimmer h-4 w-4/6 rounded"></div>
      </div>
    </div>
  </main>

  <script>
    const supabaseClient = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    // Utilities
    const fmtDate = (iso) => {
      try {
        return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return ''; }
    };

    const estimateReadTime = (markdown) => {
      if (!markdown) return '1 min read';
      const words = markdown.replace(/[#>*_`~\-\[\]\(\)]/g, ' ').split(/\s+/).filter(Boolean).length;
      const mins = Math.max(1, Math.ceil(words / 200)); // ~200 wpm
      return `${mins} min read`;
    };

    const isNew = (iso) => {
      const d = new Date(iso);
      const diff = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
      return diff <= 7; // 7 days
    };

    const container = document.getElementById('updates-container');
    const skeleton = document.getElementById('updates-skeleton');

    if (slug) {
      // Detail page
      supabaseClient.from('posts')
        .select('title, slug, content_md, published_at, cover_url, excerpt')
        .eq('slug', slug)
        .eq('status', 'published')
        .single()
        .then(({ data, error }) => {
          if (error || !data) {
            container.innerHTML = `
              <div class="max-w-xl mx-auto text-center">
                <h1 class="text-2xl font-bold mb-2">Post not found</h1>
                <p class="text-slate-500 mb-6">The update you're looking for does not exist or is no longer available.</p>
                <a href="/updates.html" class="inline-flex items-center px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700 transition">← Back to all updates</a>
              </div>`;
            return;
          }

          const readTime = estimateReadTime(data.content_md);
          container.innerHTML = `
            <article class="bg-white rounded-2xl shadow p-4 sm:p-6">
              <div class="mb-4">
                <a href="/updates.html" class="inline-flex items-center text-blue-600 hover:underline mb-2">← Back to all updates</a>
              </div>

              ${data.cover_url ? `<img src="${data.cover_url}" alt="" class="rounded-xl w-full mb-4">` : ''}

              <header class="mb-4">
                <h1 class="text-3xl font-bold leading-tight">${data.title}</h1>
                <div class="mt-2 flex flex-wrap items-center gap-3 text-sm text-slate-500">
                  <span>${fmtDate(data.published_at)}</span>
                  <span>•</span>
                  <span>${readTime}</span>
                  ${isNew(data.published_at) ? `<span class="inline-flex items-center px-2 py-0.5 text-xs font-medium bg-green-100 text-green-700 rounded-full">New</span>` : ''}
                </div>
              </header>

              <div class="prose max-w-none prose-slate">
                ${marked.parse(data.content_md || (data.excerpt ?? ''))}
              </div>
            </article>
          `;
        });
    } else {
      // List page
      supabaseClient.from('posts')
        .select('title, slug, excerpt, published_at, cover_url, content_md')
        .eq('status', 'published')
        .lte('published_at', new Date().toISOString())
        .order('published_at', { ascending: false })
        .then(({ data, error }) => {
          if (error) {
            container.innerHTML = `
              <h1 class="text-3xl font-bold mb-6">🚀 Updates & Announcements</h1>
              <div class="bg-white rounded-2xl p-6 shadow border border-red-100">
                <p class="text-red-600 font-medium mb-1">Error loading posts.</p>
                <p class="text-slate-600 text-sm">Please try again in a moment.</p>
              </div>`;
            return;
          }

          if (!data || data.length === 0) {
            container.innerHTML = `
              <h1 class="text-3xl font-bold mb-6">🚀 Updates & Announcements</h1>
              <div class="bg-white rounded-2xl p-10 shadow text-center">
                <p class="text-slate-600">No updates yet. Stay tuned — announcements will appear here.</p>
              </div>`;
            return;
          }

          const cards = data.map(post => {
            const readTime = estimateReadTime(post.content_md || post.excerpt || '');
            return `
              <div class="bg-white p-4 rounded-2xl shadow hover:shadow-lg transition">
                ${post.cover_url ? `<img src="${post.cover_url}" alt="" class="rounded-xl w-full mb-3">` : ''}
                <div class="flex items-start gap-2">
                  <h2 class="text-xl font-semibold flex-1 leading-snug">
                    <a class="hover:underline" href="/updates.html?slug=${post.slug}">${post.title}</a>
                  </h2>
                  ${isNew(post.published_at) ? `<span class="inline-flex items-center px-2 py-0.5 text-xs font-medium bg-green-100 text-green-700 rounded-full">New</span>` : ''}
                </div>
                <p class="text-sm text-gray-500 mt-1">${fmtDate(post.published_at)} • ${readTime}</p>
                <p class="mt-3 text-slate-700">${post.excerpt || 'Read the full announcement for details.'}</p>
                <div class="mt-4">
                  <a href="/updates.html?slug=${post.slug}"
                     class="inline-flex items-center px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700 transition">
                    Read more
                  </a>
                </div>
              </div>
            `;
          }).join('');

          container.innerHTML = `
            <h1 class="text-3xl font-bold mb-6">🚀 Updates & Announcements</h1>
            <div class="grid gap-6">${cards}</div>
          `;
        });
    }
  </script>

  <div id="ciwai-footer"></div>

  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/header.js"></script>
  <script src="/assets/js/hero.js"></script>

</body>
</html>

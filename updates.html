<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CiwAI Smart Digital — Updates</title>
  <meta name="description"
    content="Stay updated with the latest news, product improvements, and release notes from CiwAI Smart Digital." />

  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .shimmer {
      position: relative;
      overflow: hidden;
      background: #e5e7eb;
    }

    .shimmer:after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, rgba(229, 231, 235, 0) 0%, rgba(255, 255, 255, .7) 50%, rgba(229, 231, 235, 0) 100%);
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800" data-page="updates" data-hero-title="Updates"
  data-hero-subtitle="Latest news, product improvements, and release notes from CiwAI™." data-hero-variant="subtle">

  <script src="/assets/js/lang.js"></script>

  <div id="ciwai-header"></div>
  <div id="ciwai-hero"></div>

  <main class="max-w-4xl mx-auto py-12 px-4" id="updates-container">
    <h1 class="text-3xl font-black mb-8 tracking-tight text-slate-900">🚀 Updates & Announcements</h1>

    <div id="loading-state" class="grid gap-6">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <div class="shimmer h-48 w-full rounded-2xl mb-4"></div>
        <div class="shimmer h-8 w-3/4 rounded-lg mb-2"></div>
        <div class="shimmer h-4 w-1/2 rounded mb-6"></div>
        <div class="shimmer h-10 w-32 rounded-xl"></div>
      </div>
    </div>
  </main>

  <div id="ciwai-footer"></div>

  <div id="article-modal"
    class="fixed inset-0 z-[10000] hidden overflow-y-auto bg-slate-900/60 backdrop-blur-sm p-4 md:p-10">
    <div class="relative mx-auto max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden fade-in">
      <button onclick="closeModal()"
        class="absolute top-4 right-4 z-10 bg-white/80 hover:bg-white p-2 rounded-full shadow-md transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div id="modal-body" class="p-6 md:p-12 prose prose-slate max-w-none"></div>
    </div>
  </div>

  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/header.js"></script>
  <script src="/assets/js/hero.js"></script>

  <script>
    async function fetchUpdates() {
      const container = document.getElementById('updates-container');
      try {
        // Fetching from Dev.to API
        const res = await fetch('https://dev.to/api/articles?tag=changelog&per_page=5');
        const posts = await res.json();

        let html = '<h1 class="text-3xl font-black mb-8 tracking-tight text-slate-900">🚀 Updates & Announcements</h1><div class="grid gap-8">';

        posts.forEach(post => {
          const isNew = (new Date() - new Date(post.published_at)) / (1000 * 60 * 60 * 24) <= 7;
          html += `
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 group fade-in">
                            ${post.cover_image ? `<img src="${post.cover_image}" class="rounded-2xl w-full h-52 object-cover mb-6">` : ''}
                            <div class="flex items-center gap-2 mb-3">
                                <h2 class="text-2xl font-bold group-hover:text-blue-600 transition leading-tight">${post.title}</h2>
                                ${isNew ? '<span class="px-2 py-0.5 text-[10px] font-black bg-blue-600 text-white rounded-full uppercase">New</span>' : ''}
                            </div>
                            <p class="text-slate-400 text-sm mb-4 font-medium italic">
                                ${new Date(post.published_at).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' })} • ${post.reading_time_minutes} min read
                            </p>
                            <p class="text-slate-600 mb-6 line-clamp-2">${post.description}</p>
                            <button onclick="openModal(${post.id})" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-blue-600 hover:-translate-y-1 transition-all shadow-lg shadow-slate-200">
                                Read Insight
                            </button>
                        </div>
                    `;
        });
        container.innerHTML = html + '</div>';
      } catch (e) {
        container.innerHTML = '<div class="py-20 text-center text-slate-400">Failed to load updates. Our database is resting, bro.</div>';
      }
    }

    async function openModal(id) {
      const modal = document.getElementById('article-modal');
      const modalBody = document.getElementById('modal-body');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      modalBody.innerHTML = '<div class="py-20 text-center">Loading...</div>';

      try {
        const res = await fetch('https://dev.to/api/articles/' + id);
        const data = await res.json();
        modalBody.innerHTML = `
                    <img src="${data.cover_image}" class="w-full h-64 object-cover rounded-2xl mb-8">
                    <h1 class="text-3xl font-black mb-4">${data.title}</h1>
                    <div class="article-body">${data.body_html}</div>
                `;
      } catch (e) { modalBody.innerHTML = 'Error loading content.'; }
    }

    function closeModal() {
      document.getElementById('article-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    fetchUpdates();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruang Ujian PKBM HALIFA</title>

    <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
    <link rel="stylesheet" href="/assets/style.css">

    <meta property="og:title" content="Ruang Ujian PKBM HALIFA">
    <meta property="og:description" content="Portal ujian resmi PKBM HALIFA">
</head>

<body class="home-page">

    <div id="header"></div>

    <main class="container" style="margin-top:60px;text-align:center;max-width:720px;">

        <h1 style="color:#4f46e5;">Ruang Ujian PKBM HALIFA</h1>

        <p style="opacity:.8;margin-top:15px;">
            Selamat datang di portal ujian resmi PKBM HALIFA
        </p>

        <!-- ACTION BUTTON -->
        <div style="margin-top:35px;display:flex;flex-direction:column;gap:15px;">

            <button onclick="masukUjian()" style="background:#4f46e5;">
                📝 Masuk Ruang Ujian
            </button>

            <button onclick="lihatHasil()" style="background:#16a34a;">
                📊 Lihat Hasil Ujian
            </button>

        </div>

        <!-- INFO -->
        <div style="background:#f8fafc;padding:15px;border-radius:12px;margin-top:30px;border:1px solid #e2e8f0;">
            <p style="font-size:13px;margin:0;color:#64748b;">
                ℹ️ Gunakan email yang sama dengan saat mengerjakan ujian untuk melihat hasil evaluasi.
            </p>
        </div>

    </main>

    <div id="footer"></div>

    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/footer.js"></script>

    <script>
        function masukUjian() {
            localStorage.setItem("login", "guest");
            location.href = "pilih.html";
        }

        function lihatHasil() {
            location.href = "hasilujian/inggris.html";
        }
    </script>

</body>

</html>

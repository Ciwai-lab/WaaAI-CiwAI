<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruang Ujian PKBM HALIFA</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

    <div class="container">
        <h1>Ruang Ujian PKBM HALIFA</h1>

        <p>
            Selamat datang di Ruang Ujian PKBM HALIFA.<br>
            Silakan masuk untuk melihat ruang ujian.
        </p>

        <button onclick="masuk()">Masuk Ruang Ujian</button>

        <p style="opacity:.7;margin-top:15px">
            * Login NIK akan diaktifkan kembali setelah data lengkap.
        </p>

        <p style="background:#1e293b;padding:10px;border-radius:8px;margin-top:20px">
            ℹ️ Mode tamu aktif sementara.
        </p>
    </div>

    <script>
        function masuk() {
            localStorage.setItem("login", "guest");
            location.href = "pilih.html";
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

    <title>Pilih Paket - Ruang Ujian</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

    <script>

        <span>Ruang Ujian</span>

    </div>

    <div class="container">
        <h2>Pilih Paket Kelas</h2>

        <a href="a/index.html">Paket A</a>
        <a href="b/index.html">Paket B</a>
        <a href="c/index.html">Paket C</a>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("login");
            location.href = "/ruangujian/";
        }
    </script>

</body>

</html>

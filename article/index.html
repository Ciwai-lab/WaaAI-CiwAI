<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CiwAI Smart Digital — Insights</title>
  <meta name="description"
    content="Explore automated tech insights and tutorials from the global community, curated by CiwAI." />

  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-in-card {
      animation: fadeIn 0.5s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass-card {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .article-body {
      color: #1e293b;
      font-size: 1.125rem;
      line-height: 1.8;
    }

    .article-body img {
      width: 100%;
      height: auto;
      border-radius: 1rem;
      margin: 1.5rem 0;
    }

    .article-body a {
      color: #2563eb;
      text-decoration: underline;
    }

    .article-body ul {
      list-style-type: disc;
      margin-left: 1.5rem;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800" data-page="article">

  <div id="ciwai-header"></div>

  <section class="py-20 bg-white border-b border-slate-100">
    <div class="max-w-4xl mx-auto px-4 text-center md:text-left">
      <h1 class="text-5xl font-black tracking-tighter text-slate-900 sm:text-6xl">
        Tech <span class="text-blue-600">Insights</span>
      </h1>
      <p class="mt-6 text-lg text-slate-500 max-w-2xl leading-relaxed">
        Curated perspectives on the future of technology, AI, and digital innovation from the global tech community.
      </p>
    </div>
  </section>

  <main class="max-w-4xl mx-auto py-12 px-4" id="article-content">
    <div id="loader" class="space-y-8 animate-pulse">
      <div class="h-48 bg-slate-200 rounded-3xl w-full"></div>
      <div class="h-6 bg-slate-200 rounded w-3/4"></div>
      <div class="h-4 bg-slate-200 rounded w-1/2"></div>
    </div>
  </main>

  <div id="ciwai-footer"></div>

  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/header.js"></script>

  <script>
    async function fetchGlobalArticles() {
      const contentArea = document.getElementById('article-content');

      try {
        const response = await fetch('https://dev.to/api/articles?tag=ai&per_page=6');
        if (!response.ok) throw new Error('Gagal narik data');

        const articles = await response.json();

        let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-8">';

        articles.forEach((art, index) => {
          html += `
            <div class="fade-in-card glass-card rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 group" style="animation-delay: ${index * 100}ms">
              <div class="relative h-48 overflow-hidden">
                <img src="${art.cover_image || 'https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80'}" 
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
                     alt="${art.title}">
              </div>
              <div class="p-6">
                <div class="flex items-center gap-2 mb-3">
                  <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded-md">
                    ${art.tag_list[0] || 'Tech'}
                  </span>
                  <span class="text-xs text-slate-400">${Math.ceil(art.reading_time_minutes)} min read</span>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-2 leading-snug group-hover:text-blue-600 transition">
                  ${art.title}
                </h3>
                <p class="text-slate-500 text-sm line-clamp-2 mb-4">
                  ${art.description}
                </p>
                <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                  <div class="flex items-center gap-2">
                    <img src="${art.user.profile_image_90}" class="w-6 h-6 rounded-full border border-slate-200">
                    <span class="text-xs font-medium text-slate-600">${art.user.name}</span>
                  </div>
<button onclick="openModal(${art.id})" class="text-xs font-bold text-slate-900 flex items-center gap-1 hover:text-blue-600 transition">
    READ INSIGHT 
    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
    </svg>
</button>
                </div>
              </div>
            </div>
          `;
        });

        html += '</div>';
        contentArea.innerHTML = html;

      } catch (err) {
        contentArea.innerHTML = `
          <div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
            <span class="text-5xl">📡</span>
            <h2 class="text-xl font-bold mt-4 text-slate-800">Koneksi Lagi Galau</h2>
            <p class="text-slate-500 mb-6">Gagal narik artikel dari server global. Mungkin internet ente lagi kena hujan, bro.</p>
            <button onclick="location.reload()" class="px-6 py-2 bg-slate-900 text-white rounded-full hover:bg-slate-800 transition shadow-lg">
              Coba Lagi
            </button>
          </div>
        `;
      }
    }

    async function openModal(id) {
      const modal = document.getElementById('article-modal');
      const modalBody = document.getElementById('modal-body');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';

      modalBody.innerHTML = `
        <div class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500 animate-pulse">Fetching insight...</p>
        </div>`;

      try {
        const response = await fetch(`https://dev.to/api/articles/${id}`);
        if (!response.ok) throw new Error('API Error');

        const data = await response.json();

        const content = data.body_html || data.description || "No content available, bro.";

        modalBody.innerHTML = `
            <div class="animate-fade-in">
                <img src="${data.cover_image || 'https://via.placeholder.com/800x400'}" 
                     class="w-full h-64 object-cover rounded-2xl mb-8 shadow-sm">
                
                <h1 class="text-3xl font-black text-slate-900 mb-4 leading-tight">${data.title}</h1>
                
                <div class="flex items-center gap-3 mb-10 pb-6 border-b border-slate-100">
                    <img src="${data.user.profile_image_90}" class="w-10 h-10 rounded-full border border-slate-100">
                    <div>
                        <p class="text-sm font-bold text-slate-800">${data.user.name}</p>
                        <p class="text-xs text-slate-400">${new Date(data.published_at).toLocaleDateString()} • ${data.reading_time_minutes} min read</p>
                    </div>
                </div>

                <div class="article-content prose prose-slate max-w-none text-slate-700">
                    ${content}
                </div>

                <div class="mt-12 pt-6 border-t border-slate-100">
                    <button onclick="closeModal()" class="text-sm font-bold text-slate-400 hover:text-slate-900 transition">
                        ESC TO CLOSE
                    </button>
                </div>
            </div>
        `;
      } catch (err) {
        modalBody.innerHTML = `
            <div class="text-center py-20">
                <span class="text-5xl">⚠️</span>
                <h2 class="text-xl font-bold mt-4">Failed to load article</h2>
                <p class="text-slate-500">Coba cek koneksi internet atau refresh browser ente, bro.</p>
            </div>`;
      }
    }

    function closeModal() {
      const modal = document.getElementById('article-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = 'auto'; // Re-enable scroll
    }

    // Eksekusi
    document.addEventListener('DOMContentLoaded', fetchGlobalArticles);
  </script>

  <div id="article-modal"
    class="fixed inset-0 z-[10000] hidden overflow-y-auto bg-slate-900/60 backdrop-blur-sm p-4 md:p-10">
    <div class="relative mx-auto max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
      <button onclick="closeModal()"
        class="absolute top-4 right-4 z-10 bg-white/80 hover:bg-white p-2 rounded-full shadow-md transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div id="modal-body" class="p-6 md:p-12 prose prose-slate max-w-none">
      </div>
    </div>
  </div>

</body>

</html>

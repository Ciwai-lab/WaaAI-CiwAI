<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CiwAI Smart Digital — Support</title>
    <meta name="description" content="Official Help Center for CiwAI Smart Digital: FAQ, guides, and support form." />
    <link rel="icon" href="/favicon.ico" />

    <!-- OG tags -->
    <meta property="og:title" content="CiwAI Smart Digital — Support">
    <meta property="og:description" content="Need help? Reach our team.">
    <meta property="og:url" content="https://ciwaidevtools.netlify.app/support">
    <meta property="og:type" content="website">

    <!-- Tailwind CDN duluan -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lib lain (env, supabase, marked) -->
    <script src="/assets/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Schema / JSON-LD -->
    <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"CiwAI Smart Digital",
    "url":"https://ciwaidevtools.netlify.app",
    "logo":"https://ciwaidevtools.netlify.app/icon.png",
    "sameAs":[],
    "contactPoint":[{
      "@type":"ContactPoint","contactType":"customer support",
      "availableLanguage":["en","id"],
      "url":"https://ciwaidevtools.netlify.app/support"
    }]
  }
  </script>
</head>

<body class="bg-slate-50 text-slate-800" data-hero-title="Support"
    data-hero-subtitle="Bantuan cepat untuk semua produk CiwAI™" data-hero-variant="brand" class="bg-black text-white">
    <!-- HEADER placeholder -->
    <div id="ciwai-header"></div>

    <!-- HERO placeholder -->
    <div id="ciwai-hero"></div>

    <!-- ======= Content ======= -->
    <main class="max-w-4xl mx-auto py-10 px-4" id="article-content">
        <p class="text-gray-500">Loading article...</p>
    </main>

    <!-- ======= Script ======= -->
    <script>
        const supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');

        async function loadArticle() {
            if (!slug) {
                document.getElementById('article-content').innerHTML = `<p class="text-red-500">No article specified.</p>`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('support_articles')
                .select('*')
                .eq('slug', slug)
                .eq('status', 'published')
                .single();

            if (error || !data) {
                document.getElementById('article-content').innerHTML = `<p class="text-red-500">Article not found.</p>`;
                return;
            }

            document.title = `${data.title} - CiwAI Support`;
            document.getElementById('article-content').innerHTML = `
        <h1 class="text-3xl font-bold mb-2">${data.title}</h1>
        <p class="text-sm text-gray-500 mb-6">${data.category} • ${new Date(data.published_at).toLocaleDateString()}</p>
        ${data.cover_url ? `<img src="${data.cover_url}" class="rounded mb-6"/>` : ''}
        <article class="prose max-w-none">${marked.parse(data.content_md)}</article>
        <div class="mt-8"><a href="/support" class="text-blue-600 hover:underline">← Back to Support</a></div>
      `;
        }

        loadArticle();
    </script>

    <!-- Footer -->
    <div id="ciwai-footer"></div>

    <script src="/footer.js"></script>
    <script src="/header.js"></script>
    <script src="/hero.js"></script>
    <script src="/footer.js"></script>
</body>

</html>
